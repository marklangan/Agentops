# Deliberately imperfect manifest for agents to review
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: myregistry.azurecr.io/api:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_PASSWORD
              value: "hunter2"
          securityContext:
            privileged: true
